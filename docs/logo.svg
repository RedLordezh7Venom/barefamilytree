<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" shape-rendering="crispEdges">
  <!-- Retro 90s/Early-2000s Beveled Window Banner -->
  <defs>
    <filter id="retro-shadow" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#0b1016"/>
    </filter>
  </defs>

  <!-- Outer Frame & Classic Bevel -->
  <rect x="4" y="4" width="530" height="110" fill="#0d1117" stroke="#30363d" stroke-width="2" rx="4"/>
  <rect x="6" y="6" width="526" height="4" fill="#388bfd" opacity="0.6"/>

  <!-- Left: Pixel Art Tree & Family Nodes (Pre-2007 8-bit style) -->
  <g transform="translate(24, 20)">
    <!-- Tree Foliage (Pixel Blocks) -->
    <rect x="36" y="4" width="8" height="8" fill="#3fb950"/>
    <rect x="28" y="12" width="24" height="8" fill="#2ea043"/>
    <rect x="20" y="20" width="40" height="8" fill="#238636"/>
    <rect x="12" y="28" width="56" height="8" fill="#2ea043"/>
    <rect x="20" y="36" width="40" height="8" fill="#196c2e"/>
    
    <!-- Tree Trunk -->
    <rect x="36" y="44" width="8" height="12" fill="#8b5a2b"/>
    <rect x="34" y="56" width="12" height="6" fill="#6e461f"/>

    <!-- Retro Node Connector Lines -->
    <rect x="12" y="52" width="56" height="3" fill="#58a6ff"/>
    <rect x="12" y="55" width="3" height="10" fill="#58a6ff"/>
    <rect x="65" y="55" width="3" height="10" fill="#58a6ff"/>
    <rect x="38" y="58" width="3" height="12" fill="#58a6ff"/>

    <!-- Family Node Badges -->
    <rect x="4" y="65" width="18" height="10" fill="#1f6feb" rx="1"/>
    <rect x="58" y="65" width="18" height="10" fill="#d29922" rx="1"/>
    <rect x="31" y="70" width="18" height="10" fill="#a371f7" rx="1"/>
  </g>

  <!-- Middle & Right: Classic Retro Typography & Tagline -->
  <g transform="translate(130, 26)">
    <!-- Title: Chunky retro serif / monospace early-web aesthetic -->
    <text x="0" y="34" font-family="'Courier New', Courier, monospace, 'Lucida Console'" font-size="28" font-weight="900" fill="#58a6ff" letter-spacing="1">
      BARE<tspan fill="#3fb950">FAMILY</tspan><tspan fill="#f0883e">TREE</tspan>
    </text>
    <text x="0" y="56" font-family="Verdana, Geneva, sans-serif" font-size="12" fill="#8b949e" letter-spacing="0.5">
      [v1.0] • ZERO-BLOAT NATIVE GENEALOGY CANVAS
    </text>
    
    <!-- Retro Status Tags / Early Web Badges -->
    <g transform="translate(0, 66)">
      <rect x="0" y="0" width="62" height="16" fill="#161b22" stroke="#30363d"/>
      <text x="6" y="12" font-family="'Courier New', monospace" font-size="10" fill="#7ee787">100% VANILLA</text>

      <rect x="68" y="0" width="52" height="16" fill="#161b22" stroke="#30363d"/>
      <text x="74" y="12" font-family="'Courier New', monospace" font-size="10" fill="#79c0ff">CLI + GUI</text>

      <rect x="126" y="0" width="56" height="16" fill="#161b22" stroke="#30363d"/>
      <text x="132" y="12" font-family="'Courier New', monospace" font-size="10" fill="#d2a8ff">0-DEPENDENCY</text>

      <rect x="188" y="0" width="48" height="16" fill="#161b22" stroke="#30363d"/>
      <text x="194" y="12" font-family="'Courier New', monospace" font-size="10" fill="#ffa657">UNDO/REDO</text>
    </g>
  </g>
</svg>
